services:
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://iqkuyqvhsrzlnanltybu.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bFGGkLFIOZYIfjbMrogW7g_Haw2W0zt
        NEXT_PUBLIC_SITE_URL: https://rooms.twsiat.com
    restart: always
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
  # MT5 price bridge (Linux + Wine, browser access via mt5.twsiat.com). Only started with COMPOSE_PROFILES=bridge
  # (set by bridge-install.sh in deploy/.env together with the login password — that file is never committed).
  mt5:
    build:
      context: ./mt5
      args:
        WINE_SERIES: ${WINE_SERIES:-10.0}
    profiles: ["bridge"]
    restart: always
    environment:
      - CUSTOM_USER=${MT5_USER:-trader}
      - PASSWORD=${MT5_PASSWORD:-}
      - TZ=Etc/UTC
    volumes:
      - /opt/mt5:/config
volumes:
  caddy_data:
