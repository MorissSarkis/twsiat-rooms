# ---------------------------------------------------------------
# Pivot Ladder Alerts — settings
# ---------------------------------------------------------------

# Where prices come from: mt5 (recommended, matches the broker exactly),
# yahoo (free, for testing) or demo (simulated prices, no internet needed)
# Where prices come from:
#   supabase = the Twsiat price bridge (MT5 on the VPS -> Supabase), used on the server   <-- default
#   mt5      = a MetaTrader 5 terminal on the same Windows computer
#   demo     = simulated prices, to try the app
feed: supabase
supabase:
  url: https://iqkuyqvhsrzlnanltybu.supabase.co
  publishable_key: sb_publishable_bFGGkLFIOZYIfjbMrogW7g_Haw2W0zt   # public key (already in the web app)
  # alerts_token: comes from the ALERTS_TOKEN environment variable (deploy/.env) — never put it here
  live_max_age_seconds: 120   # a live price older than this falls back to the last closed M5 bar
mt5_suffix: "m"            # only for feed: mt5 (Exness Standard: XAUUSDm)

# ---------------------------------------------------------------
# The private app (phone notifications + dashboard)
# ---------------------------------------------------------------
app:
  password: ""              # on the server: ALERTS_PASSWORD in deploy/.env
  port: 8080
  host: 0.0.0.0
  contact: "mailto:you@example.com"   # your email; push services may use it if something is wrong

# Optional extra channels next to the app (normally empty): [telegram] and/or [whatsapp]
extra_channels: []

telegram:
  bot_token: ""
  chat_ids: []

whatsapp:
  phone_number_id: ""
  access_token: ""
  to: []
  template_name: pivot_alert
  template_lang: en

# mode: all    = alert every time price reaches ANY level (S1-S3, P, R1-R3),
#                falling or rising, no trend filter  <-- what the client asked for
#       ladder = only buy levels (S) in an uptrend / sell levels (R) in a downtrend,
#                plus bounce, stop and trend-break alerts
mode: all
levels: [R3, R2, R1, P, S1, S2, S3]   # which levels to alert on in "all" mode
approach_alerts: true      # also send "price falling/rising toward S1" a little before
cross_buffer_atr: 0.15     # price must be this far on the other side before a new crossing counts (stops wobble spam)

poll_seconds: 10           # how often prices are checked
refresh_minutes: 15        # how often levels / trend / ATR are recalculated
# Trend = the client's rule: UP while the long-term bottom holds, DOWN while the
# long-term top holds. Found automatically on daily bars; he can also set his own
# level from Telegram with /bottom GOLD 4066 or /top OIL 75.20.
trend_timeframe: D1        # timeframe used to find the long-term bottom/top
swing_strength: 5          # bars on each side that confirm a swing (5 on D1 = about a week)

# Distances are a fraction of each asset's daily ATR(14),
# so gold, EUR/GBP and BTC all behave sensibly with the same settings.
approach_atr: 0.10         # "approaching" alert when within 10% of ATR of a level
rearm_atr: 0.30            # level re-arms after price moves this far away again
stop_buffer_atr: 0.05      # S3/R3 counts as broken once price is beyond it by this much
alert_without_trend: false # true = send both ladders even when trend is unclear
daily_summary: true        # one message per new day with all levels and trends

# name:  label shown in the app and alerts
# group: forex / commodities / indices / crypto / stocks (filter tabs in the app)
# mt5:   symbol name as the bridge sends it, WITHOUT the broker suffix. A list = names to try in order; the first one
#        that exists at the broker is used (brokers name indices and commodities differently).
#        Anything not found at the broker shows a warning on its card in the app.
