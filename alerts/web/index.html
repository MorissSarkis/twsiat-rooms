<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البيفوت">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<title>تنبيهات البيفوت</title>
<style>
  :root {
    --bg:#0e141b; --card:#151d27; --card2:#1a2430; --line:#233042; --text:#e6edf5; --muted:#8a9bb0; --dim:#5d6e83;
    --green:#26c676; --green-bg:rgba(38,198,118,.12); --red:#ef5350; --red-bg:rgba(239,83,80,.12);
    --amber:#f5b53f; --amber-bg:rgba(245,181,63,.12); --stop:#ff6b6b;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans Arabic", -apple-system, "Segoe UI", Tahoma, sans-serif; font-size:15px; }
  .num { font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; direction:ltr; unicode-bidi:isolate;
         font-variant-numeric:tabular-nums; font-weight:500; }
  header { position:sticky; top:0; z-index:5; background:rgba(14,20,27,.92); backdrop-filter:blur(10px);
           padding:calc(12px + var(--safe-t)) 16px 10px; border-bottom:1px solid var(--line); }
  .hrow { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:18px; margin:0; font-weight:700; }
  .live { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--green); box-shadow:0 0 0 3px rgba(38,198,118,.18); }
  .dot.off { background:var(--red); }
  main { padding:12px 16px calc(84px + var(--safe-b)); max-width:760px; margin:0 auto; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:transparent;
          color:var(--muted); font:inherit; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600; }
  .banner { margin:12px 0 4px; padding:14px; border-radius:14px; background:var(--amber-bg); border:1px solid rgba(245,181,63,.35);
            display:flex; gap:12px; align-items:center; justify-content:space-between; font-size:14px; }
  .banner b { display:block; margin-bottom:2px; }
  .btn { font:inherit; font-size:14px; font-weight:600; padding:10px 16px; border-radius:10px; border:0; cursor:pointer;
         background:var(--amber); color:#1a1205; white-space:nowrap; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn.danger { background:transparent; color:var(--red); border:1px solid rgba(239,83,80,.4); }
  .btn:disabled { opacity:.5; }
  .sorter { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; margin:14px 0 8px; }
  .sorter select { font:inherit; font-size:13px; background:var(--card); color:var(--text); border:1px solid var(--line);
                   border-radius:8px; padding:5px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; }
  .card.muted { opacity:.55; }
  .crow { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .name { font-weight:700; font-size:15px; letter-spacing:.2px; }
  .price { font-size:17px; }
  .chg { font-size:13px; margin-inline-end:10px; color:var(--muted); }
  .chg.pos { color:var(--green); } .chg.neg { color:var(--red); }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; font-weight:600; }
  .pill.up { background:var(--green-bg); color:var(--green); }
  .pill.down { background:var(--red-bg); color:var(--red); }
  .pill.range { background:var(--card2); color:var(--muted); }
  .near { font-size:13px; color:var(--muted); margin-top:4px; }
  .near.hot { color:var(--amber); }
  /* level ladder: always low -> high from left to right */
  .ladder { position:relative; height:30px; margin:12px 4px 2px; direction:ltr; }
  .ladder .track { position:absolute; left:0; right:0; top:13px; height:4px; border-radius:2px;
                   background:linear-gradient(90deg, rgba(239,83,80,.45), rgba(245,181,63,.45) 50%, rgba(38,198,118,.45)); }
  .ladder .tick { position:absolute; top:9px; width:2px; height:12px; margin-left:-1px; border-radius:1px; background:var(--dim); }
  .ladder .tick.S { background:var(--red); } .ladder .tick.R { background:var(--green); } .ladder .tick.P { background:var(--amber); height:16px; top:7px; }
  .ladder .lab { position:absolute; top:-3px; font-size:9.5px; color:var(--dim); transform:translateX(-50%); font-family:"IBM Plex Mono", monospace; }
  .ladder .mark { position:absolute; top:6px; width:18px; height:18px; margin-left:-9px; border-radius:50%;
                  background:#fff; border:4px solid var(--bg); box-shadow:0 0 0 1px rgba(255,255,255,.4); transition:left .6s ease; }
  .ladder .out { position:absolute; top:7px; font-size:12px; color:#fff; }
  .err { color:var(--red); font-size:12px; margin-top:6px; }
  /* alerts */
  .day { color:var(--muted); font-size:12px; margin:18px 2px 8px; font-weight:600; }
  .al { background:var(--card); border:1px solid var(--line); border-right:4px solid var(--dim); border-radius:12px;
        padding:12px 14px; margin-bottom:8px; }
  .al.up { border-right-color:var(--green); } .al.down { border-right-color:var(--red); }
  .al.break { border-right-color:var(--stop); background:rgba(255,107,107,.06); }
  .al .t { display:flex; justify-content:space-between; gap:10px; font-weight:600; }
  .al .time { color:var(--dim); font-size:12px; font-weight:400; flex:none; }
  .al .b { white-space:pre-line; color:#c8d3df; font-size:14px; margin-top:6px; line-height:1.6; }
  .empty { text-align:center; color:var(--muted); padding:48px 16px; }
  /* settings */
  .sec { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .sec h3 { margin:0 0 4px; font-size:15px; }
  .sec p { margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.6; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .tog { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .tog:first-of-type { border-top:0; }
  .switch { position:relative; display:inline-block; width:46px; height:28px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.2s; cursor:pointer; }
  .switch span::before { content:""; position:absolute; width:22px; height:22px; top:3px; right:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + span { background:var(--green); }
  .switch input:checked + span::before { transform:translateX(-18px); }
  #lvChips { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
  .lvchip { padding:9px 0; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted);
            font-family:"IBM Plex Mono", monospace; font-size:14px; cursor:pointer; }
  .lvchip.on.S { background:var(--red-bg); color:var(--red); border-color:rgba(239,83,80,.4); }
  .lvchip.on.R { background:var(--green-bg); color:var(--green); border-color:rgba(38,198,118,.4); }
  .lvchip.on.P { background:var(--amber-bg); color:var(--amber); border-color:rgba(245,181,63,.4); }
  /* bottom nav */
  nav { position:fixed; bottom:0; left:0; right:0; z-index:6; display:flex; background:rgba(21,29,39,.96); backdrop-filter:blur(10px);
        border-top:1px solid var(--line); padding-bottom:var(--safe-b); }
  nav button { flex:1; background:none; border:0; color:var(--dim); font:inherit; font-size:12px; padding:10px 0 9px; cursor:pointer;
               display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; }
  nav button.on { color:var(--text); }
  nav svg { width:22px; height:22px; }
  nav .badge { position:absolute; top:6px; left:calc(50% - 20px); background:var(--red); color:#fff; font-size:10px;
               min-width:16px; height:16px; border-radius:8px; padding:0 4px; line-height:16px; }
  /* detail sheet */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:10; display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--card); border-radius:20px 20px 0 0;
           max-height:88vh; overflow:auto; padding:8px 16px calc(20px + var(--safe-b)); transform:translateY(100%);
           transition:transform .25s ease; max-width:760px; margin:0 auto; }
  .sheet.open { transform:none; }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 14px; }
  .lvtable { width:100%; border-collapse:collapse; margin:10px 0 6px; }
  .lvtable td { padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .lvtable td:last-child { text-align:left; color:var(--muted); font-size:13px; }
  .lvtable tr.cur td { color:#fff; font-weight:700; background:var(--card2); }
  .lvtable .S { color:var(--red); } .lvtable .R { color:var(--green); } .lvtable .P { color:var(--amber); }
  .field { display:flex; gap:8px; margin-top:10px; }
  .field input { flex:1; font:inherit; font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
                 background:var(--bg); color:var(--text); direction:ltr; min-width:0; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; font:inherit; font-size:14px; padding:9px 12px; border:0; background:transparent; color:var(--muted); cursor:pointer; }
  .seg button.on.up { background:var(--green-bg); color:var(--green); } .seg button.on.down { background:var(--red-bg); color:var(--red); }
  .toast { position:fixed; bottom:calc(84px + var(--safe-b)); left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
           padding:10px 16px; border-radius:10px; font-size:14px; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>تنبيهات البيفوت</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">جارِ التحميل…</span></div>
  </div>
  <div class="chips" id="groups"></div>
</header>

<main>
  <div id="pushBanner" class="banner hidden"></div>

  <section id="tab-assets">
    <div class="sorter">
      <span id="count"></span>
      <select id="sort" aria-label="ترتيب">
        <option value="near">الأقرب لمستوى</option>
        <option value="up">الأكثر ارتفاعاً اليوم</option>
        <option value="down">الأكثر انخفاضاً اليوم</option>
        <option value="list">حسب القائمة</option>
      </select>
    </div>
    <div id="assets"></div>
  </section>

  <section id="tab-alerts" class="hidden"><div id="alerts"></div></section>

  <section id="tab-settings" class="hidden">
    <div class="sec">
      <h3>الإشعارات على هذا الجهاز</h3>
      <p id="pushStatus">…</p>
      <div class="row">
        <button class="btn" id="enablePush">تفعيل الإشعارات</button>
        <button class="btn ghost" id="testPush">إرسال تنبيه تجريبي</button>
      </div>
    </div>
    <div class="sec">
      <h3>المستويات</h3>
      <p>اختار المستويات اللي بدك تنبيه عليها (نزول أو طلوع).</p>
      <div class="row" id="lvChips"></div>
      <div class="tog" style="margin-top:12px">
        <div><div>تنبيه قبل الوصول</div><div style="color:var(--muted);font-size:13px">"السعر نازل باتجاه S1" قبل ما يوصله بشوي</div></div>
        <label class="switch"><input type="checkbox" id="approach"><span></span></label>
      </div>
    </div>
    <div class="sec">
      <h3>الأصول المكتومة</h3>
      <p>أصل مكتوم ما بيبعت إشعار، بس تنبيهاته بتضل بالسجل. للكتم افتح الأصل من قائمة الأصول.</p>
      <div id="mutedList" style="color:var(--muted);font-size:14px"></div>
    </div>
    <div class="sec">
      <h3>الحساب</h3>
      <p id="sysInfo"></p>
      <button class="btn danger" id="logout">تسجيل خروج</button>
    </div>
  </section>
</main>

<nav>
  <button data-tab="assets" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="9" cy="12" r="2" fill="currentColor"/></svg>
    الأصول</button>
  <button data-tab="alerts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    التنبيهات<span class="badge hidden" id="newBadge"></span></button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    الإعدادات</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const LEVELS = ["R3","R2","R1","P","S1","S2","S3"];
const GROUPS = [["all","الكل"],["forex","فوركس"],["commodities","سلع"],["indices","مؤشرات"],["crypto","كريبتو"],["stocks","أسهم"]];
const S = { assets:[], alerts:[], settings:null, group:"all", tab:"assets", lastPoll:null, devices:0, seenAlert:null, openAsset:null, me:{} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function autoDigits(ref) { const a = Math.abs(ref); return a < 10 ? 5 : a < 1000 ? 3 : 2; }
// digits for an asset: from the broker if known, otherwise from the size of its price
const dig = (a) => a.digits ?? autoDigits(a.price ?? a.levels?.P ?? 1);
function fmt(v, digits) {
  if (v == null || isNaN(v)) return "—";
  if (digits == null) digits = autoDigits(v);
  return Number(v).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
const levelClass = (k) => k[0];
function staleText(a) {
  if (!a.quote_t) return "";
  const mins = Math.round((Date.now() - new Date(a.quote_t)) / 60000);
  if (mins < 5) return "";
  const txt = mins < 60 ? `${mins} دقيقة` : mins < 1440 ? `${Math.round(mins / 60)} ساعة` : `${Math.round(mins / 1440)} يوم`;
  return `<div class="near" style="color:var(--dim)">آخر سعر قبل ${txt} (السوق مغلق أو لا يوجد تداول)</div>`;
}
const pct = (v) => v == null || isNaN(v) ? "" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + "%";
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, credentials: "same-origin", ...opts });
  if (r.status === 401) { location.href = "/login"; throw new Error("auth"); }
  if (r.status === 403 && path !== "/api/override" && path !== "/api/override/clear") { location.href = "/expired"; throw new Error("auth"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "خطأ");
  return j;
}

// ---------- tabs ----------
function setTab(t) {
  if (!["assets","alerts","settings"].includes(t)) t = "assets";
  S.tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ["assets","alerts","settings"].forEach(x => $("tab-" + x).classList.toggle("hidden", x !== t));
  $("groups").classList.toggle("hidden", t !== "assets");
  if (t === "alerts") { S.seenAlert = S.alerts[0]?.id; try { localStorage.setItem("seenAlert", S.seenAlert || ""); } catch(_){} renderBadge(); }
  if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

// ---------- assets ----------
function renderGroups() {
  $("groups").innerHTML = GROUPS.map(([k,l]) => `<button class="chip ${S.group===k?"on":""}" data-g="${k}">${l}</button>`).join("");
  $("groups").querySelectorAll(".chip").forEach(c => c.onclick = () => { S.group = c.dataset.g; renderGroups(); renderAssets(); });
}

function ladderHTML(a) {
  if (!a.levels) return "";
  const lo = a.levels.S3, hi = a.levels.R3, span = hi - lo || 1;
  const pos = (v) => 4 + 92 * (v - lo) / span;
  let html = `<div class="track"></div>`;
  for (const k of LEVELS) {
    const x = pos(a.levels[k]);
    html += `<div class="tick ${levelClass(k)}" style="left:${x}%"></div>`;
    if (k !== "R2" && k !== "S2") html += `<div class="lab" style="left:${x}%">${k}</div>`;
  }
  if (a.price != null) {
    const raw = pos(a.price);
    if (raw < 0) html += `<div class="out" style="left:0">◀</div>`;
    else if (raw > 100) html += `<div class="out" style="right:0">▶</div>`;
    html += `<div class="mark" style="left:${Math.max(1, Math.min(99, raw))}%"></div>`;
  }
  return `<div class="ladder">${html}</div>`;
}

function nearText(a) {
  if (!a.nearest || a.price == null) return "";
  const n = a.nearest, d = n.distance;
  const where = Math.abs(d) < 1e-12 ? "على" : d > 0 ? "فوق" : "تحت";
  const hot = n.atr_frac != null && n.atr_frac < 0.15;
  return `<div class="near ${hot ? "hot" : ""}">${where} ${n.level} <span class="num">${fmt(n.value, dig(a))}</span> بفرق <span class="num">${fmt(Math.abs(d), dig(a))}</span></div>`;
}

function renderAssets() {
  let list = S.assets.filter(a => S.group === "all" || a.group === S.group);
  const sortBy = $("sort").value;
  if (sortBy === "near")
    list = [...list].sort((x, y) => (x.nearest?.atr_frac ?? 9) - (y.nearest?.atr_frac ?? 9));
  else if (sortBy === "up")
    list = [...list].sort((x, y) => (y.change_pct ?? -1e9) - (x.change_pct ?? -1e9));
  else if (sortBy === "down")
    list = [...list].sort((x, y) => (x.change_pct ?? 1e9) - (y.change_pct ?? 1e9));
  $("count").textContent = `${list.length} أصل`;
  $("assets").innerHTML = list.map(a => `
    <div class="card ${a.muted ? "muted" : ""}" data-name="${esc(a.name)}">
      <div class="crow">
        <div><span class="name">${esc(a.name)}</span> ${a.muted ? "🔕" : ""}</div>
        <span><span class="chg num ${a.change_pct > 0 ? "pos" : a.change_pct < 0 ? "neg" : ""}">${pct(a.change_pct)}</span>
          <span class="price num">${fmt(a.price, dig(a))}</span></span>
      </div>
      <div class="crow" style="margin-top:4px">
        ${nearText(a) || "<div></div>"}
        ${a.trend ? `<span class="pill ${a.trend}">${esc(a.trend_ar)}</span>` : ""}
      </div>
      ${ladderHTML(a)}
      ${staleText(a)}
      ${a.error ? `<div class="err">⚠️ ${/not available/.test(a.error) ? "غير متوفرة عند الشركة" : /no prices yet/.test(a.error) ? "لا توجد أسعار بعد — جسر الأسعار لا يرسل هذه الأداة" : /history loading/.test(a.error) ? "⏳ جارِ تحميل التاريخ من جسر الأسعار — المستويات بتظهر خلال دقائق" : esc(a.error)}</div>` : ""}
    </div>`).join("") || `<div class="empty">ما في بيانات بعد…</div>`;
  $("assets").querySelectorAll(".card").forEach(c => c.onclick = () => openSheet(c.dataset.name));
}
$("sort").onchange = () => { try { localStorage.setItem("sort", $("sort").value); } catch(_){} renderAssets(); };

// ---------- detail sheet ----------
function openSheet(name) { S.openAsset = name; renderSheet(); $("sheetBg").style.display = "block"; requestAnimationFrame(() => $("sheet").classList.add("open")); }
function closeSheet() { S.openAsset = null; $("sheet").classList.remove("open"); setTimeout(() => $("sheetBg").style.display = "none", 250); }
$("sheetBg").onclick = closeSheet;

function renderSheet() {
  const a = S.assets.find(x => x.name === S.openAsset);
  if (!a) return;
  let rows = "", placed = false;
  if (a.levels) {
    for (const k of LEVELS) {
      const v = a.levels[k];
      if (!placed && a.price != null && a.price > v) {
        rows += `<tr class="cur"><td>السعر الآن</td><td class="num">${fmt(a.price, dig(a))}</td><td></td></tr>`; placed = true;
      }
      const d = a.price != null ? v - a.price : null;
      rows += `<tr><td class="${levelClass(k)}">${k}</td><td class="num">${fmt(v, dig(a))}</td><td class="num">${d == null ? "" : (d > 0 ? "+" : "−") + fmt(Math.abs(d), dig(a))}</td></tr>`;
    }
    if (!placed && a.price != null) rows += `<tr class="cur"><td>السعر الآن</td><td class="num">${fmt(a.price, dig(a))}</td><td></td></tr>`;
  }
  const anchorLine = a.anchor != null && a.trend !== "range"
    ? `${a.trend === "up" ? "القاع" : "القمة"}: <span class="num">${fmt(a.anchor, dig(a))}</span>${a.manual ? " (محدد يدوياً)" : " (تلقائي)"}` : "";
  const t = a.manual ? a.trend : (a.trend === "down" ? "down" : "up");
  $("sheet").innerHTML = `
    <div class="grab"></div>
    <div class="crow"><span class="name" style="font-size:20px">${esc(a.name)}</span><span><span class="chg num ${a.change_pct > 0 ? "pos" : a.change_pct < 0 ? "neg" : ""}">${pct(a.change_pct)}</span><span class="price num" style="font-size:22px">${fmt(a.price, dig(a))}</span></span></div>
    <div class="crow" style="margin-top:6px"><span style="color:var(--muted);font-size:13px">مستويات يوم <span class="num">${esc(a.day || "")}</span></span>
      ${a.trend ? `<span class="pill ${a.trend}">${esc(a.trend_ar)}</span>` : ""}</div>
    <table class="lvtable">${rows}</table>
    <div class="sec" style="margin-top:14px">
      <h3>الميل العام</h3>
      <p>${anchorLine || "النظام ما لقى ميل واضح."} صاعد طالما القاع صامد، وهابط طالما القمة صامدة.</p>
      ${S.me.admin ? `<div class="seg" id="segT"><button data-t="up" class="${t==="up"?"on up":""}">صاعد — القاع</button><button data-t="down" class="${t==="down"?"on down":""}">هابط — القمة</button></div>
      <div class="field"><input id="anchorIn" inputmode="decimal" placeholder="مثلاً 4066" value="${a.manual ? a.anchor : ""}">
        <button class="btn" id="saveAnchor">حفظ</button></div>
      ${a.manual ? `<button class="btn ghost" id="clearAnchor" style="margin-top:10px;width:100%">رجوع للتلقائي</button>` : ""}` : ""}
    </div>
    <div class="sec">
      <div class="tog"><div><div>كتم إشعارات ${esc(a.name)}</div><div style="color:var(--muted);font-size:13px">التنبيهات بتضل تنحفظ بالسجل</div></div>
        <label class="switch"><input type="checkbox" id="muteIn" ${a.muted ? "checked" : ""}><span></span></label></div>
    </div>`;
  let trendSel = t;
  if ($("segT")) $("segT").querySelectorAll("button").forEach(b => b.onclick = () => {
    trendSel = b.dataset.t;
    $("segT").querySelectorAll("button").forEach(x => x.className = x.dataset.t === trendSel ? "on " + trendSel : "");
  });
  if ($("saveAnchor")) $("saveAnchor").onclick = async () => {
    const v = parseFloat(($("anchorIn").value || "").replace(/,/g, ""));
    if (!isFinite(v)) return toast("اكتب رقم صحيح");
    try { await api("/api/override", { method: "POST", body: JSON.stringify({ asset: a.name, trend: trendSel, anchor: v }) });
          toast("انحفظ ✓"); await loadState(); renderSheet(); } catch (e) { toast(e.message); }
  };
  if ($("clearAnchor")) $("clearAnchor").onclick = async () => {
    await api("/api/override/clear", { method: "POST", body: JSON.stringify({ asset: a.name }) }); toast("رجع للتلقائي"); await loadState(); renderSheet();
  };
  $("muteIn").onchange = async (e) => {
    const muted = new Set(S.settings.muted); e.target.checked ? muted.add(a.name) : muted.delete(a.name);
    await saveSettings({ muted: [...muted] }); renderSheet();
  };
}

// ---------- alerts ----------
function dayLabel(d) {
  const today = new Date(); const y = new Date(); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return "اليوم";
  if (d.toDateString() === y.toDateString()) return "مبارح";
  return d.toLocaleDateString("ar", { weekday: "long", day: "numeric", month: "long" });
}
function renderAlerts() {
  if (!S.alerts.length) { $("alerts").innerHTML = `<div class="empty">ما في تنبيهات لسا. أول ما يوصل السعر لمستوى بتظهر هون.</div>`; return; }
  let html = "", last = "";
  for (const al of S.alerts) {
    const d = new Date(al.ts), lbl = dayLabel(d);
    if (lbl !== last) { html += `<div class="day">${lbl}</div>`; last = lbl; }
    const time = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    html += `<div class="al ${esc(al.action)}"><div class="t"><span>${esc(al.title)}</span><span class="time num">${time}</span></div><div class="b">${esc(al.body)}</div></div>`;
  }
  $("alerts").innerHTML = html;
}
function renderBadge() {
  const i = S.alerts.findIndex(a => a.id === S.seenAlert);
  const n = S.tab === "alerts" ? 0 : (i === -1 ? Math.min(S.alerts.length, 99) : i);
  $("newBadge").textContent = n; $("newBadge").classList.toggle("hidden", !n);
}

// ---------- settings ----------
function renderSettings() {
  if (!S.settings) return;
  const on = new Set(S.settings.levels);
  $("lvChips").innerHTML = LEVELS.map(k => `<button class="lvchip ${levelClass(k)} ${on.has(k) ? "on" : ""}" data-k="${k}">${k}</button>`).join("");
  $("lvChips").querySelectorAll(".lvchip").forEach(c => c.onclick = () => {
    const s = new Set(S.settings.levels); s.has(c.dataset.k) ? s.delete(c.dataset.k) : s.add(c.dataset.k); saveSettings({ levels: [...s] });
  });
  $("approach").checked = !!S.settings.approach;
  $("mutedList").textContent = S.settings.muted.length ? S.settings.muted.join("، ") : "ولا أصل مكتوم.";
  const me = S.me || {};
  const plan = me.reason === "ib" ? "مجاني — عميل وكالة موقع توصيات"
    : me.reason === "paid" && me.until ? `اشتراك لغاية <span class="num">${new Date(me.until).toLocaleDateString("en-GB")}</span>${me.members ? ` · <a href="${esc(me.members)}" style="color:var(--amber)">تجديد</a>` : ""}`
    : me.reason === "staff" ? "فريق العمل" : me.reason === "owner" ? "الإدارة" : "";
  $("sysInfo").innerHTML = (me.name ? `${esc(me.name)}<br>` : "") + (plan ? `${plan}<br>` : "")
    + `آخر تحديث للأسعار: <span class="num">${S.lastPoll ? new Date(S.lastPoll).toLocaleTimeString("en-GB") : "—"}</span><br>أجهزة مفعّل عليها الإشعارات: <span class="num">${S.devices}</span>`
    + (me.stats ? `<br>مستخدمين عندهم إشعارات: <span class="num">${me.stats.people}</span> · أجهزة: <span class="num">${me.stats.devices}</span>` : "");
}
$("approach").onchange = (e) => saveSettings({ approach: e.target.checked });
async function saveSettings(patch) {
  try { const j = await api("/api/settings", { method: "POST", body: JSON.stringify(patch) }); S.settings = j.settings; renderSettings(); await loadState(); toast("انحفظ ✓"); }
  catch (e) { toast(e.message); }
}
$("logout").onclick = async () => { await api("/api/logout", { method: "POST" }); location.href = "/login"; };

// ---------- push notifications ----------
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReg = null;

function b64ToBytes(b64) {
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function currentSub() { return swReg ? await swReg.pushManager.getSubscription() : null; }

async function renderPush() {
  const banner = $("pushBanner"); let status, showBanner = false, bannerHTML = "";
  if (isIOS && !standalone) {
    status = "على الآيفون لازم تضيف التطبيق للشاشة الرئيسية أول: زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية»، وبعدها افتحه من الأيقونة.";
    bannerHTML = `<div><b>ثبّت التطبيق عشان توصلك الإشعارات</b>زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية»</div>`; showBanner = true;
    $("enablePush").disabled = true;
  } else if (!pushSupported) {
    status = "هذا المتصفح ما بيدعم الإشعارات. جرّب Chrome على أندرويد أو Safari على آيفون (iOS 16.4+).";
    $("enablePush").disabled = true;
  } else if (Notification.permission === "denied") {
    status = "الإشعارات ممنوعة لهذا الموقع. فعّلها من إعدادات المتصفح/الجهاز وارجع.";
    $("enablePush").disabled = true;
  } else {
    const sub = await currentSub();
    if (sub && Notification.permission === "granted") {
      status = "✅ الإشعارات مفعّلة على هذا الجهاز."; $("enablePush").textContent = "إعادة التفعيل";
    } else {
      status = "الإشعارات مش مفعّلة على هذا الجهاز.";
      bannerHTML = `<div><b>فعّل الإشعارات</b>عشان يوصلك كل تنبيه على الموبايل</div><button class="btn" id="bannerEnable">تفعيل</button>`; showBanner = true;
    }
  }
  $("pushStatus").textContent = status;
  banner.innerHTML = bannerHTML; banner.classList.toggle("hidden", !showBanner);
  if ($("bannerEnable")) $("bannerEnable").onclick = enablePush;
}

async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("لازم تسمح بالإشعارات"); return renderPush(); }
    const { key } = await api("/api/vapid");
    let sub = await currentSub();
    if (sub) await sub.unsubscribe().catch(() => {});
    sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    await api("/api/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }) });
    toast("تم تفعيل الإشعارات ✓");
  } catch (e) { toast("ما زبط: " + e.message); }
  renderPush(); loadState();
}
$("enablePush").onclick = enablePush;
$("testPush").onclick = async () => {
  try { const j = await api("/api/test", { method: "POST" }); toast(j.devices ? "انبعث ✓" : "ما في جهاز مفعّل"); loadAlerts(); } catch (e) { toast(e.message); }
};

// ---------- data loop ----------
async function loadState() {
  try {
    const j = await api("/api/state");
    S.assets = j.assets; S.settings = j.settings; S.lastPoll = j.last_poll; S.devices = j.push_devices; S.me = j.me || {};
    const age = S.lastPoll ? (Date.now() - new Date(S.lastPoll)) / 1000 : 1e9;
    $("dot").className = "dot " + (age < 120 ? "on" : "off");
    $("updated").innerHTML = S.lastPoll ? `مباشر · <span class="num">${new Date(S.lastPoll).toLocaleTimeString("en-GB")}</span>` : "بانتظار الأسعار…";
    renderAssets(); renderSettings();
    if (S.openAsset) { const keep = document.activeElement && document.activeElement.id === "anchorIn"; if (!keep) renderSheet(); }
  } catch (e) { if (e.message !== "auth") { $("dot").className = "dot off"; $("updated").textContent = "ما في اتصال"; } }
}
async function loadAlerts() {
  try { const j = await api("/api/alerts?limit=200"); S.alerts = j.alerts; renderAlerts(); renderBadge(); } catch (_) {}
}

(async function init() {
  try { S.seenAlert = localStorage.getItem("seenAlert"); $("sort").value = localStorage.getItem("sort") || "near"; } catch(_){}
  renderGroups();
  if ("serviceWorker" in navigator) { try { swReg = await navigator.serviceWorker.register("/sw.js", { scope: "/" }); await navigator.serviceWorker.ready; } catch (_) {} }
  await Promise.all([loadState(), loadAlerts()]);
  setTab((location.hash || "#assets").slice(1).replace(/[^a-z]/g, "") || "assets");
  renderPush();
  setInterval(() => { if (!document.hidden) loadState(); }, 5000);
  setInterval(() => { if (!document.hidden) loadAlerts(); }, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadState(); loadAlerts(); renderPush(); } });
  window.addEventListener("hashchange", () => setTab(location.hash.slice(1) || "assets"));
})();
</script>
</body>
