<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البيفوت">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>تسجيل الدخول · البيفوت</title>
<style>
  :root { --bg:#0e141b; --card:#151d27; --line:#233042; --text:#e6edf5; --muted:#8a9bb0; --accent:#f5b53f; --red:#ef5350; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:"IBM Plex Sans Arabic", -apple-system, "Segoe UI", Tahoma, sans-serif; padding:24px 16px; }
  .box { width:100%; max-width:360px; }
  .logo { width:64px; height:64px; border-radius:16px; display:block; margin:0 auto 18px; }
  h1 { font-size:22px; text-align:center; margin:0 0 6px; font-weight:700; }
  p { text-align:center; color:var(--muted); margin:0 0 28px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:8px; }
  input { width:100%; font:inherit; font-size:17px; padding:14px 16px; border-radius:12px; border:1px solid var(--line);
          background:var(--card); color:var(--text); outline:none; direction:ltr; text-align:left; }
  input:focus { border-color:var(--accent); }
  button { width:100%; margin-top:16px; font:inherit; font-size:16px; font-weight:600; padding:14px; border:0;
           border-radius:12px; background:var(--accent); color:#1a1205; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--red); font-size:14px; min-height:20px; margin-top:12px; text-align:center; }
</style>
</head>
<body>
  <form class="box" id="f">
    <img class="logo" src="/icon-192.png" alt="">
    <h1>تنبيهات البيفوت</h1>
    <p>الدعم والمقاومة لحظة بلحظة</p>
    <label for="pw">كلمة السر</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="b" type="submit">دخول</button>
    <div class="err" id="err"></div>
  </form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }) });
    if (r.ok) { location.href = "/"; return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.detail || "صار خطأ، جرّب مرة ثانية";
  } catch (_) { err.textContent = "ما في اتصال بالسيرفر"; }
  b.disabled = false;
});
</script>
</body>
</html>
